[project]
name = "entirius-py-process-logger"
version = "2.0.0"
description = "Structured process logger (logging.LoggerAdapter with contextual params)"
authors = [{ name = "Entirius" }]
readme = "README.md"
requires-python = ">=3.11"
license = "MPL-2.0"
dependencies = []

[project.optional-dependencies]
dev  = ["ruff", "pre-commit"]
test = ["pytest"]

[project.urls]
Repository = "https://github.com/entirius/entirius-py-process-logger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/process_logger"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "DJ", "S"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**" = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["process_logger"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
